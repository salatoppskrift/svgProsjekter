<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/rådyr.css">
</head>

<body>

  <h1>The polygon() Function</h1>

  <div class="container">
    <img src="bilder/rådyrpåtur.jpg" alt="Reference image">
    <svg class="deer"></svg>
    <!--<svg class="hat"></svg>-->
  </div>
  <span>gg</span>
  <div style="background-color: plum; width: 56px; height: 20px;">gg</div>
  <button>Change polygon points</button>
  <div class="deer2"></div>

  <script>
    const str = `polygon(
    calc(var(--wW) - (var(--h) * 0.3)) 60%,
    calc(var(--wW)) 75%,
    calc(var(--wW) + (var(--h) * 0.095)) 50%
    `;
    const origStr = document.getElementsByClassName("deer")[0].style.clipPath;

    console.log("hey?\n" + origStr);

    document.getElementsByTagName("button")[0].addEventListener("click", () => { document.getElementsByClassName("deer")[0].style.clipPath = str; });
  </script>
</body>

</html>
