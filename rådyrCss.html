<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/rådyr.css">
</head>

<body>

  <h1>The Deer() Function</h1>

  <div class="container">
    <img src="bilder/rådyrpåtur.jpg" alt="Reference image">
    <svg class="deer"></svg>
    <!--<svg class="hat"></svg>-->
  </div>
  <span>gg</span>
  <div id="widthSize"></div>
  <button>Change polygon points</button>
  <div class="deer2"></div>

</body>
<script>
  const updateSizeText = w => {
    const goal = 970;
    let spanText = ``;
    console.log("meme");
    if (window.innerWidth === goal) spanText = `<span class="correct">Riktig!!</span>`;
    else if (window.innerWidth > 950 && window.innerWidth < 990) spanText = `<span class="warm">Varmere... ${goal - window.innerWidth}</span>`;
    else spanText = `<span class="wrong">! FALSE !!</span>`;
    
    document.getElementById("widthSize").innerHTML = `
      <p>
        <b>${goal} ? </b> ${window.innerWidth} === ${goal} => ${spanText}
      </p>
    `;
  };

  updateSizeText();
  window.addEventListener("resize", updateSizeText);

</script>

</html>
