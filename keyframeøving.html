<!DOCTYPE html>
<html>
<head>
<style> 
:root {
  --posE: 0px;
  --pos1: 50px;
  --pos2: 100px;
  --posF: 150px;
  /*
  --hundo: 100%;
  */
  --hundo: 400px;
  
  --squareDuration: 3s;
}
* {
  margin: 0;
  padding: 0;
}
body {
  hr { margin: 2rem 1rem; }
  ul li { margin: 0 2rem; }
  s { color: gray; font-size: 0.7rem; font-style: italic; }
}
.h {
  background: linear-gradient(to right, aliceblue 50%, orange 50%);
  opacity: 75%;
}
.square {
  width: 100px;
  aspect-ratio: 1;
  background: red;
  position: relative;
  left: 50%;
  animation: linear var(--squareDuration) infinite;
  animation-name: mymove, minmove2;
}
@keyframes mymove {
  0% { top: 0; }
  100% { top: var(--hundo); }
}
@keyframes minmove2 {
  50% { top: 200px; }
}
</style>
</head>
<body>


<div class="h">
  <div class="square"></div>
  <div id="ll">ll</div>
  <hr>
  <ul>
    <li>100px, <s>208</s> 293px</li>
    <li>50px, ?px</li>
  </ul>
</div>

</body>
<script>
  const hhhh = ["-2", "0", "", "  ", "5", "_"];
  let tt = hhhh.map(hhh => (Number(hhh.trim()) <= 0) || (Number.isNaN(Number(hhh.trim()))) ? false : Boolean(hhh.trim()));
  
  document.getElementById("ll").innerHTML =
    tt.map((t,i) => 
        ("\"" + hhhh[i] + "\": " + t + ", <i>" + typeof t + "</i><br>")
      ).join("");
</script>
</html>
